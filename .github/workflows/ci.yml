name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  benchmark-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Test benchmark contracts
        run: python -B -m unittest discover -s tests -v
      - name: Validate implementation expectation
        run: >-
          python -B -m turnvector_benchmark expectation
          --manifest expectations/turnvector-implementation-v1.json
      - name: Validate scheduler suite
        run: python -B -m turnvector_benchmark validate --suite suites/scheduler-policy-v1.json
      - name: Run reference benchmark
        run: >-
          python -B -m turnvector_benchmark run
          --expectation expectations/turnvector-implementation-v1.json
          --lane scheduler-policy
          --suite suites/scheduler-policy-v1.json
          --driver-command "python -B drivers/reference_driver.py"
          --output "$RUNNER_TEMP/turnvector-benchmark-artifact"
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-benchmark-evidence
          path: ${{ runner.temp }}/turnvector-benchmark-artifact
          if-no-files-found: error
